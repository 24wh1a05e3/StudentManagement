apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: studentmanagement-deployer
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["studentmanagement"]
    verbs: ["get", "list", "watch", "patch", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: studentmanagement-deployer-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: default
roleRef:
  kind: Role
  name: studentmanagement-deployer
  apiGroup: rbac.authorization.k8s.io